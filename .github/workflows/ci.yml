name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, unit and API tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build --workspace=shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E smoke (mock Gemini)
    runs-on: ubuntu-latest
    needs: checks
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
    env:
      MOCK_GEMINI: 'true'
      MONGODB_URI_E2E: mongodb://127.0.0.1:27017/ai-mystery-room-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Generate a throwaway session secret for this run
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run e2e
